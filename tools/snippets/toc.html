<!-- tk:meta
name: Table of contents
tool: toc
group: Progress
description: Builds an accessible navigation list from article headings.
interactive: yes
param: data-variant :: inline | sticky :: inline :: Chooses a normal or sticky panel.
param: data-levels :: comma-separated 2,3,4 :: 2,3 :: Heading levels included in the list.
param: data-label :: text :: Table of contents :: Accessible name for the generated navigation landmark.
a11y: The runtime creates a named navigation landmark and marks the active section.
limits: The block hides itself unless the article has at least two qualifying headings outside toolkit blocks.
-->
<div class="tk-block tk-toc" data-tk="toc" data-variant="inline" data-levels="2,3" data-label="Table of contents">
    <p class="tk-toc__title">On this page</p>
    <p class="tk-toc__fallback">This article's sections are listed here once the page finishes loading.</p>
</div>
